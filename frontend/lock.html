<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>SafeVault</title>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #08070a;
            color: #fff;
            font-family: "DM Sans", sans-serif;
        }

        button, input { font-family: inherit; }

        .app {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            min-height: 100dvh;
            margin: auto;
            padding: 28px 24px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;

            background:
                radial-gradient(circle at 50% 18%, rgba(244, 63, 94, 0.16), transparent 42%),
                #0c0a0f;
        }

        .fade-in { animation: rise 0.7s cubic-bezier(.2,.7,.2,1) both; }
        .d1 { animation-delay: .08s; } .d2 { animation-delay: .16s; }
        .d3 { animation-delay: .24s; } .d4 { animation-delay: .32s; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .emblem {
            width: 84px;
            height: 84px;
            border-radius: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 34px;
            margin-bottom: 22px;

            background: linear-gradient(135deg, rgba(253,164,175,.16), rgba(244,63,94,.10));
            border: 1px solid #3a2a35;
            box-shadow: 0 0 60px rgba(244, 63, 94, 0.18);
            animation: rise .7s cubic-bezier(.2,.7,.2,1) both, glow 4s ease-in-out 1s infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 40px rgba(244, 63, 94, 0.12); }
            50%      { box-shadow: 0 0 70px rgba(244, 63, 94, 0.26); }
        }

        h1 {
            font-family: "Syne", sans-serif;
            font-size: 32px;
            letter-spacing: .3px;
        }

        .tagline {
            margin-top: 6px;
            color: #fda4af;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .prompt {
            margin: 34px 0 18px;
            color: #b4a8b1;
            font-size: 15px;
        }

        .pin-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .pin-row input {
            width: 46px;
            height: 58px;
            border-radius: 16px;
            border: 1px solid #332630;
            background: #151117;
            color: #fff;
            font-size: 24px;
            text-align: center;
            outline: none;
            caret-color: #fda4af;
            transition: border-color .2s, box-shadow .2s, transform .2s, background .2s;
        }

        .pin-row input:focus {
            border-color: #fda4af;
            box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.14);
            transform: translateY(-2px);
        }

        .pin-row input.filled { border-color: #5b3946; background: #1b141b; }

        .pin-row.shake { animation: shake .45s; }
        .pin-row.error input { border-color: #f43f5e; }

        @keyframes shake {
            10%, 90% { transform: translateX(-2px); }
            20%, 80% { transform: translateX(4px); }
            30%, 50%, 70% { transform: translateX(-7px); }
            40%, 60% { transform: translateX(7px); }
        }

        .error-text {
            min-height: 22px;
            margin-top: 16px;
            font-size: 14px;
            color: #fb7185;
            opacity: 0;
            transition: opacity .25s;
        }

        .error-text.show { opacity: 1; }

        .unlock {
            width: 100%;
            max-width: 330px;
            margin-top: 10px;
            padding: 16px;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            color: #220b12;
            background: linear-gradient(135deg, #fda4af, #f43f5e);
            transition: transform .15s, opacity .2s, box-shadow .2s;
            box-shadow: 0 10px 30px rgba(244, 63, 94, 0.25);
        }

        .unlock:hover:not(:disabled) { transform: translateY(-1px); }
        .unlock:active:not(:disabled) { transform: scale(.98); }
        .unlock:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

        .foot {
            margin-top: 26px;
            color: #6c616a;
            font-size: 12px;
        }

        @media (max-width: 380px) {
            .pin-row { gap: 7px; }
            .pin-row input { width: 40px; height: 52px; }
        }

        @media (min-width: 700px) {
            body { display: flex; justify-content: center; padding: 25px; }
            .app { min-height: 850px; border-radius: 35px; box-shadow: 0 30px 80px rgba(0,0,0,.65); }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }

    </style>
</head>

<body>

<main class="app">

    <div class="emblem" aria-hidden="true">🔒</div>

    <h1 class="fade-in d1">SafeVault</h1>
    <p class="tagline fade-in d1">Your private space</p>

    <p class="prompt fade-in d2" id="prompt">Enter your PIN to continue</p>

    <div class="pin-row fade-in d3" id="pinRow" role="group" aria-label="6-digit PIN">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN digit 1">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN digit 2">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN digit 3">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN digit 4">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN digit 5">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN digit 6">
    </div>

    <div class="error-text" id="errorText" role="alert" aria-live="assertive"></div>

    <button class="unlock fade-in d4" id="unlockBtn" disabled>Unlock SafeVault</button>

    <p class="foot fade-in d4">Nothing is shown until you unlock.</p>

</main>

<script>

    const boxes = Array.from(document.querySelectorAll("#pinRow input"));
    const row = document.getElementById("pinRow");
    const errorText = document.getElementById("errorText");
    const unlockBtn = document.getElementById("unlockBtn");

    let busy = false;
    let blockedUntil = 0;
    let timer = null;

    function getPin() { return boxes.map(b => b.value).join(""); }

    function refresh() {
        boxes.forEach(b => b.classList.toggle("filled", b.value !== ""));
        unlockBtn.disabled = busy || Date.now() < blockedUntil || getPin().length !== 6;
    }

    function clearBoxes() {
        boxes.forEach(b => { b.value = ""; });
        refresh();
        boxes[0].focus();
    }

    function showError(text) {
        errorText.textContent = text;
        errorText.classList.add("show");
        row.classList.remove("shake");
        void row.offsetWidth;                 // restart animation
        row.classList.add("error", "shake");
    }

    function clearError() {
        errorText.classList.remove("show");
        row.classList.remove("error", "shake");
    }

    function startCountdown(seconds) {
        blockedUntil = Date.now() + seconds * 1000;
        clearInterval(timer);
        const tick = () => {
            const left = Math.ceil((blockedUntil - Date.now()) / 1000);
            if (left <= 0) {
                clearInterval(timer);
                clearError();
                errorText.textContent = "";
                boxes.forEach(b => b.disabled = false);
                refresh();
                boxes[0].focus();
                return;
            }
            errorText.textContent = "Too many attempts. Try again in " + left + "s";
            errorText.classList.add("show");
            refresh();
        };
        boxes.forEach(b => b.disabled = true);
        row.classList.add("error");
        tick();
        timer = setInterval(tick, 500);
    }

    function nextTarget() {
        const params = new URLSearchParams(window.location.search);
        const next = params.get("next");
        // Only ever return to one of our own protected pages
        return ["dashboard.html", "evidence.html", "timeline.html"].includes(next)
            ? "/" + next : "/dashboard.html";
    }

    async function unlock() {

        const pin = getPin();
        if (busy || pin.length !== 6 || Date.now() < blockedUntil) return;

        busy = true;
        unlockBtn.textContent = "Unlocking…";
        refresh();

        try {

            const response = await fetch("/api/auth/unlock", {
                method: "POST",
                credentials: "same-origin",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ pin })
            });

            const result = await response.json().catch(() => ({}));

            if (response.ok) {
                window.location.replace(nextTarget());
                return;
            }

            clearBoxes();

            if (response.status === 429) {
                startCountdown(result.retry_after || 30);
            } else if (response.status === 503) {
                showError("SafeVault isn't configured yet.");
            } else {
                showError("Incorrect PIN");
            }

        } catch (error) {

            showError("Can't reach SafeVault. Check your connection.");

        } finally {

            busy = false;
            unlockBtn.textContent = "Unlock SafeVault";
            refresh();

        }
    }

    boxes.forEach((box, i) => {

        box.addEventListener("input", () => {
            box.value = box.value.replace(/\D/g, "").slice(-1);
            clearError();
            if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
            refresh();
            if (getPin().length === 6) unlockBtn.focus();
        });

        box.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" && !box.value && i > 0) {
                boxes[i - 1].value = "";
                boxes[i - 1].focus();
                refresh();
            } else if (e.key === "ArrowLeft" && i > 0) {
                boxes[i - 1].focus();
            } else if (e.key === "ArrowRight" && i < boxes.length - 1) {
                boxes[i + 1].focus();
            } else if (e.key === "Enter") {
                unlock();
            }
        });

        box.addEventListener("focus", () => box.select());

        box.addEventListener("paste", (e) => {
            e.preventDefault();
            const digits = (e.clipboardData.getData("text") || "")
                .replace(/\D/g, "").slice(0, 6);
            digits.split("").forEach((d, k) => { boxes[k].value = d; });
            clearError();
            refresh();
            (boxes[Math.min(digits.length, 5)]).focus();
        });

    });

    unlockBtn.addEventListener("click", unlock);

    boxes[0].focus();
    refresh();

</script>

</body>
</html>
